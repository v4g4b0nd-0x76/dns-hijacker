[workspace]
resolver = "3"
members = ["dns_hijacker", "resolver_proxy", "shared"]

[workspace.package]
version = "1.6.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

[profile.release-perf]
inherits = "release"
opt-level = 3
