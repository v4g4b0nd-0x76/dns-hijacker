[package]
name = "resolver_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
    "std",
] }
clap = { version = "4.6.1", features = ["derive"] }

tokio = { version = "1.52.3", default-features = false, features = [
    "rt",
    "process",
    "fs",
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
toml = { version = "1.1.2", default-features = false, features = [
    "parse",
    "serde",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
socket2 = "0.5"
tracing = "0.1.44"
arc-swap = "1.9.2"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
serde_json = "1.0.150"

shared = { path = "../shared" }
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
[profile.release]
# Size-first release build; LTO still inlines across crates for hot paths.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

[profile.release-perf]
inherits = "release"
# Prefer speed/inlining over minimal size when needed.
opt-level = 3

[features]
rand_core = []
